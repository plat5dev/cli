# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: plat5

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: plat5
    main: ./cmd/plat5
    binary: plat5
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/plat5dev/cli/internal/cmd.Version={{.Version}}

archives:
  - id: plat5
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: plat5dev
    name: cli

# brew install plat5dev/tap/plat5 (macOS and Linux). A formula, not a cask:
# casks are macOS-only and quarantine an unsigned binary.
brews:
  - name: plat5
    repository:
      owner: plat5dev
      name: homebrew-tap
      branch: master
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://www.plat5.com
    description: Run Plat5 locally and manage its routes and roles
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "plat5 {{ .Tag }}"
    install: |
      bin.install "plat5"
    test: |
      system "#{bin}/plat5", "version"
