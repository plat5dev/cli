# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: plat5

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: plat5
    main: ./cmd/plat5
    binary: plat5
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/plat5dev/cli/internal/cmd.Version={{.Version}}

archives:
  - id: plat5
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: plat5dev
    name: cli
