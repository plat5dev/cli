# Embedded by plat5 CLI. Plat5's dashboards, beside otel-lgtm's own.
apiVersion: 1
providers:
  - name: plat5
    orgId: 1
    folder: Plat5
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /otel-lgtm/plat5-dashboards
      foldersFromFilesStructure: false
