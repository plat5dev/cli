# Embedded by plat5 CLI: creates databases, audit roles, and audit schemas on
# the shared local Postgres. Always included since core's audit-migrate depends on it.
services:
  db-init:
    image: postgres:17
    entrypoint: ["/bin/sh", "/db-init.sh"]
    environment:
      PGPASSWORD: plat5
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
