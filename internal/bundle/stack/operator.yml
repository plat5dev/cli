# Embedded by plat5 CLI: the operator module. The staff front door onto the same
# identity and audit: the operator gateway, its staff audit log (operator-audit), a staff
# IdP (Plat5 Auth, its own issuer and database, never the customer one). Pulls
# ghcr.io/plat5dev/operator{,-audit}:${OPERATOR_VERSION} and
# ghcr.io/plat5dev/auth:${AUTH_VERSION}. The console is operator-console.yml.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  DEPLOYMENT_ENV: local

services:
  operator:
    image: ghcr.io/plat5dev/operator:${OPERATOR_VERSION:?}
    labels:
      service.name: operator
      service.namespace: operator
    ports:
      - "${OPERATOR_PORT:?}:5004"
    environment:
      <<: *otel
      # The image's route list: identity at http://identity:3000, the org audit log at
      # http://audit:3002, the staff audit log at http://operator-audit:5005.
      ROUTES_FILE: /routes.yml
      AUTH_ISSUER: http://localhost:${STAFF_AUTH_PORT:?}
      AUTH_JWKS_URI: http://staff-auth:5000/.well-known/jwks.json
      AUTH_AUDIENCES: operator-console
      AUTH_OPERATOR_ID_CLAIM: properties.user_id
      AUTH_OPERATOR_EMAIL_CLAIM: properties.email
      ALLOWED_ORIGINS: ${OPERATOR_ORIGINS:?}
      # Audit is on. Every authenticated request is 503 until operator-audit is up.
      AUDIT_URL: http://operator-audit:8005
      AUDIT_TOKEN: dev-audit-token
    networks:
      - plat5
    depends_on:
      staff-auth:
        condition: service_healthy
      operator-audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  operator-audit:
    image: ghcr.io/plat5dev/operator-audit:${OPERATOR_VERSION:?}
    labels:
      service.name: operator-audit
      service.namespace: operator
    command: ["serve"]
    environment:
      <<: *otel
      # The writer role: it can add events and their outcomes, never change or delete one.
      DATABASE_URL: postgres://audit_writer:audit_writer@postgres:5432/operator?sslmode=disable
      INTERNAL_TOKEN: dev-audit-token
    networks:
      - plat5
    depends_on:
      operator-audit-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  operator-audit-migrate:
    image: ghcr.io/plat5dev/operator-audit:${OPERATOR_VERSION:?}
    command: ["migrate"]
    environment:
      # The owner role: migrations and the writer's grants. Not used at runtime.
      DATABASE_URL: postgres://audit_owner:audit_owner@postgres:5432/operator?sslmode=disable
      WRITER_ROLE: audit_writer
    networks:
      - plat5
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # The staff IdP. Its token carries the email (AUTH_TOKEN_EMAIL), for the staff audit log.
  staff-auth:
    image: ghcr.io/plat5dev/auth:${AUTH_VERSION:?}
    labels:
      service.name: staff-auth
      service.namespace: operator
    ports:
      - "${STAFF_AUTH_PORT:?}:5000"
    environment:
      <<: *otel
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/staff_auth?sslmode=disable
      INTERNAL_PORT: 5001
      PUBLIC_ISSUER_URL: http://localhost:${STAFF_AUTH_PORT:?}
      AUTH_DISPLAY_NAME: ${STAFF_AUTH_DISPLAY_NAME:?}
      AUTH_ALLOWED_CLIENTS: operator-console
      AUTH_ALLOWED_REDIRECT_URIS: ${OPERATOR_REDIRECT_URIS:?}
      AUTH_ALLOWED_ORIGINS: ${OPERATOR_ORIGINS:?}
      AUTH_TOKEN_EMAIL: "true"
      AUTH_DEV_MODE: "true"
      AUTH_DEV_USERS: ${STAFF_DEV_USERS:?}
      OTEL_SERVICE_NAME: staff-auth
      OTEL_SERVICE_NAMESPACE: operator
    networks:
      - plat5
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5001/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped
