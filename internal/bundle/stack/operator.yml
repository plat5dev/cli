# Embedded by plat5 CLI: the operator module (operator gateway and operator-audit).
# Local operator-auth is in operator-auth.yml and included unless operator.idp is set.
# Pulls ghcr.io/plat5dev/operator and operator-audit at ${OPERATOR_VERSION}.
services:
  operator:
    image: ghcr.io/plat5dev/operator:${OPERATOR_VERSION:?}
    labels:
      service.name: operator
      service.namespace: operator
    ports:
      - "${OPERATOR_PORT:?}:5004"
    environment:
      CONFIG_FILE: /etc/operator/operator.yml
      IDENTITY_URL: http://identity:3000
      # The operator IdP: local operator-auth, or operator.idp from plat5.local.yml.
      AUTH_ISSUER: ${OPERATOR_AUTH_ISSUER:?}
      AUTH_JWKS_URI: ${OPERATOR_AUTH_JWKS_URI:?}
      AUTH_ALLOWED_AUDIENCES: ${OPERATOR_AUTH_AUDIENCES:?}
      AUTH_OPERATOR_ID_CLAIM: ${OPERATOR_AUTH_ID_CLAIM:?}
      AUTH_OPERATOR_EMAIL_CLAIM: ${OPERATOR_AUTH_EMAIL_CLAIM:?}
      ALLOWED_ORIGINS: ${OPERATOR_ORIGINS:-}
      AUDIT_URL: http://operator-audit:8005
    networks:
      - plat5
    depends_on:
      operator-audit:
        condition: service_healthy
      identity:
        condition: service_started
      control-plane:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  operator-audit:
    image: ghcr.io/plat5dev/operator-audit:${OPERATOR_VERSION:?}
    command: ["serve"]
    labels:
      service.name: operator-audit
      service.namespace: operator
    environment:
      # The writer role: it can add events and their outcomes, never change or delete one.
      DATABASE_URL: postgres://audit_writer:audit_writer@postgres:5432/operator?sslmode=disable
    networks:
      - plat5
    depends_on:
      operator-audit-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # Runs once per start: migrations, as the owner role db-init made.
  operator-audit-migrate:
    image: ghcr.io/plat5dev/operator-audit:${OPERATOR_VERSION:?}
    command: ["migrate"]
    environment:
      # The owner role: migrations and the writer's grants. Not used at runtime.
      DATABASE_URL: postgres://audit_owner:audit_owner@postgres:5432/operator?sslmode=disable
      WRITER_ROLE: audit_writer
    networks:
      - plat5
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"
