# Embedded by plat5 CLI: Plat5 itself (gateway, control plane, identity, audit), and
# the one Postgres the whole local stack shares. Pulls ghcr.io/plat5dev/*:${PLAT5_VERSION}.
# plat5 start sets every ${…} below; see internal/stack.
name: plat5

networks:
  plat5:
    driver: bridge

volumes:
  pg_data:

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: plat5
      POSTGRES_PASSWORD: plat5
      POSTGRES_DB: plat5
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plat5 -d plat5"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      service.name: valkey
      service.namespace: infra
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control-plane:
    image: ghcr.io/plat5dev/control-plane:${PLAT5_VERSION:?}
    labels:
      service.name: control-plane
      service.namespace: edge
      metrics.port: "5003"
    ports:
      - "${CONTROL_PLANE_PORT:?}:5002"
    environment:
      <<: *otel
      PORT: 5002
      INTERNAL_PORT: 5003
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      # Plan counts when a kind is removed.
      IDENTITY_INTERNAL_URL: http://identity:3001
      RUST_LOG: info
      OTEL_SERVICE_NAME: control-plane
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=edge,deployment.environment=local
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  gateway:
    image: ghcr.io/plat5dev/gateway:${PLAT5_VERSION:?}
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "${GATEWAY_PORT:?}:5001"
    environment:
      <<: *otel
      PORT: 5001
      INTERNAL_PORT: 8000
      # The customer IdP: local Auth, or the project's idp: block.
      AUTH_ISSUER: ${IDP_ISSUER:?}
      AUTH_JWKS_URI: ${IDP_JWKS_URI:?}
      AUTH_ALLOWED_AUDIENCES: ${IDP_AUDIENCES:?}
      AUTH_SUBJECT_CLAIM: ${IDP_SUBJECT_CLAIM:?}
      AUTH_NAME_CLAIMS: ${IDP_NAME_CLAIMS}
      IDENTITY_INTERNAL_URL: http://identity:3001
      # How long the gateway trusts an admit answer, and a refusal. It is how
      # long a revoke, suspend, or role change takes to reach the edge. Short
      # here, so a role change in plat5.yml shows on the next call; a deployment
      # picks its own (the gateway's defaults are 5m and 10s).
      ADMIT_CACHE_TTL: 5s
      ADMIT_NEGATIVE_CACHE_TTL: 5s
      AUDIT_MODE: sync
      AUDIT_URL: http://audit:3003
      RUST_LOG: info
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: "60"
      RATE_LIMIT_AUTH_FAILURE_WINDOW: "60s"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-}
      VALKEY_URL: redis://valkey:6379
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: gateway
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=edge,deployment.environment=local
    networks:
      - plat5
    # Upstreams on the host: http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      identity:
        condition: service_started
      audit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  identity:
    image: ghcr.io/plat5dev/identity:${PLAT5_VERSION:?}
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      <<: *otel
      PORT: 3000
      INTERNAL_PORT: 3001
      SECRET_BRAND: ${SECRET_BRAND:?}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: identity
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=identity,deployment.environment=local
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # Runs once per start: migrations and writer grants, as the owner role db-init made.
  audit-migrate:
    image: ghcr.io/plat5dev/audit:${PLAT5_VERSION:?}
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://audit_owner:audit_owner@postgres:5432/plat5?sslmode=disable
      WRITER_ROLE: audit_writer
    networks:
      - plat5
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  audit:
    image: ghcr.io/plat5dev/audit:${PLAT5_VERSION:?}
    command: ["serve"]
    labels:
      service.name: audit
      service.namespace: audit
      metrics.port: "3003"
    environment:
      <<: *otel
      PORT: 3002
      INTERNAL_PORT: 3003
      DATABASE_URL: postgres://audit_writer:audit_writer@postgres:5432/plat5?sslmode=disable
      OTEL_SERVICE_NAME: audit
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=audit,deployment.environment=local
    networks:
      - plat5
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped
