# Embedded by plat5 CLI: Plat5 itself (gateway, control plane, identity, audit), and
# the one Postgres the whole local stack shares. Pulls ghcr.io/plat5dev/*:${PLAT5_VERSION}.
# plat5 start sets every ${…} below; see internal/stack.
name: plat5

networks:
  plat5:
    driver: bridge

volumes:
  pg_data:

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  DEPLOYMENT_ENV: local

services:
  postgres:
    image: postgres:17
    labels:
      service.name: postgres
      service.namespace: infra
    environment:
      POSTGRES_USER: plat5
      POSTGRES_PASSWORD: plat5
      POSTGRES_DB: plat5
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - plat5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plat5 -d plat5"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Creates the other planes' databases. Runs to completion on every start.
  db-init:
    image: postgres:17
    entrypoint: ["/bin/sh", "/db-init.sh"]
    environment:
      PGPASSWORD: plat5
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      service.name: valkey
      service.namespace: infra
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - plat5
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  control-plane:
    image: ghcr.io/plat5dev/control-plane:${PLAT5_VERSION:?}
    labels:
      service.name: control-plane
      service.namespace: edge
      metrics.port: "5003"
    ports:
      - "${CONTROL_PLANE_PORT:?}:5002"
    environment:
      <<: *otel
      PORT: 5002
      INTERNAL_PORT: 5003
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      INTERNAL_AUTH_TOKEN: dev-internal-token
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      # The CLI override mounts the project's roles file and sets SEED_ROLES_FILE.
      RUST_LOG: info
      OTEL_SERVICE_NAME: control-plane
      OTEL_SERVICE_NAMESPACE: edge
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  gateway:
    image: ghcr.io/plat5dev/gateway:${PLAT5_VERSION:?}
    labels:
      service.name: gateway
      service.namespace: edge
      metrics.port: "8000"
    ports:
      - "${GATEWAY_PORT:?}:5001"
    environment:
      <<: *otel
      PORT: 5001
      INTERNAL_PORT: 8000
      # The customer IdP: local Auth, or the project's idp: block.
      AUTH_ISSUER: ${IDP_ISSUER:?}
      AUTH_JWKS_URI: ${IDP_JWKS_URI:?}
      AUTH_ALLOWED_AUDIENCES: ${IDP_AUDIENCES:?}
      AUTH_USER_ID_CLAIM: ${IDP_USER_ID_CLAIM:?}
      CREDENTIAL_VALIDATE_URL: http://identity:3001/internal/credentials/validate
      AUDIT_ENABLED: "true"
      AUDIT_URL: http://audit:3003
      INTERNAL_AUTH_TOKEN: dev-internal-token
      RUST_LOG: info
      # How long the gateway trusts a validated key, session, or IdP subject. It is
      # how long a revoke, suspend, or role change takes to reach the edge. Short
      # here, so a roles.yml edit shows on the next call; a deployment picks its
      # own (the gateway's default is 300).
      APIKEY_CACHE_TTL_SECS: "5"
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      RATE_LIMIT_AUTH_FAILURE_REQUESTS: "60"
      RATE_LIMIT_AUTH_FAILURE_WINDOW_SECONDS: "60"
      VALKEY_URL: redis://valkey:6379
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: gateway
      OTEL_SERVICE_NAMESPACE: edge
    networks:
      - plat5
    # Upstreams on the host: http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      identity:
        condition: service_started
      audit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  identity:
    image: ghcr.io/plat5dev/identity:${PLAT5_VERSION:?}
    labels:
      service.name: identity
      service.namespace: identity
      metrics.port: "3001"
    environment:
      <<: *otel
      PORT: 3000
      INTERNAL_PORT: 3001
      INTERNAL_AUTH_TOKEN: dev-internal-token
      APIKEY_BRAND: ${APIKEY_BRAND:?}
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      ROLES_ENABLED: ${ROLES_ENABLED:?}
      CONTROL_PLANE_URL: http://control-plane:5003
      OTEL_SERVICE_NAME: identity
      OTEL_SERVICE_NAMESPACE: identity
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  audit:
    image: ghcr.io/plat5dev/audit:${PLAT5_VERSION:?}
    labels:
      service.name: audit
      service.namespace: audit
      metrics.port: "3003"
    environment:
      <<: *otel
      PORT: 3002
      INTERNAL_PORT: 3003
      INTERNAL_AUTH_TOKEN: dev-internal-token
      DATABASE_URL: postgres://plat5:plat5@postgres:5432/plat5?sslmode=disable
      OTEL_SERVICE_NAME: audit
      OTEL_SERVICE_NAMESPACE: audit
    networks:
      - plat5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped
