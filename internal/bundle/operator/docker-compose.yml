# Embedded by plat5 CLI. Pulls ghcr.io/plat5dev/operator:${OPERATOR_VERSION}.
# Operator with a local staff IdP (Dex). start writes an override that:
#   - mounts the CLI-generated Dex config (clients, dev login, CORS)
#   - sets the gateway's issuer, audiences, and allowed origins
#   - attaches operator to the Plat5 network so its route list can dial identity:3000
# Identity is not published.
name: operator

services:
  operator:
    image: ghcr.io/plat5dev/operator:${OPERATOR_VERSION:-v0.3.0}
    labels:
      service.name: operator
      service.namespace: operator
    ports:
      - "5004:5004"
    environment:
      # The image's route list: identity's public paths at http://identity:3000.
      ROUTES_FILE: /routes.yml
      AUTH_JWKS_URI: http://dex:5556/dex/keys
    depends_on:
      - dex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.44.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    restart: unless-stopped
