multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: info

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

compactor:
  data_dir: /var/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /var/mimir/blocks
  tsdb:
    dir: /var/mimir/tsdb
  bucket_store:
    sync_dir: /var/mimir/tsdb-sync

memberlist:
  join_members: []

limits:
  native_histograms_ingestion_enabled: true

ruler:
  rule_path: /var/mimir/rules
  ring:
    kvstore:
      store: memberlist
