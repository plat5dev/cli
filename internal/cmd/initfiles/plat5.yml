# The deployment's config (plat5 docs/concepts/config.md): the tree's kinds, the
# roles, and the services the gateway routes to, one routes file each.
# plat5 start applies it to the local stack; plat5 apply applies it anywhere.
#
# Kinds and roles are yours: Plat5 names neither. The labels below are the
# generated routes' defaults (docs/reference/api/edge-catalog.md); add your own
# services' labels to roles here. To add a service, write routes/<name>.yml and
# list it under services.
deletion_grace: 30d
reserved_slugs: [new, settings, api, admin]
kinds:
  directory:
    sign_in: idp
    name_claim: name
  organization:
    label: Organization
    segment: orgs
  project:
    label: Project
    parent: organization
roles:
  owner:
    labels: ["*"]
    bindable_at: [organization, project]
  admin:
    labels: [organization:read, organization:write, organization:bindings:read, organization:bindings:write,
             organization:service-accounts:write, organization:audit:read, project:create, project:read]
    bindable_at: [organization]
  member:
    labels: [organization:read]
    bindable_at: [organization]
  developer:
    labels: [project:read, project:write, project:service-accounts:write, project:bindings:read]
    bindable_at: [organization, project]
default_role: member
creator_role: owner
services:
  - routes/identity.yml   # generated by plat5 routes generate
  - routes/audit.yml      # generated
